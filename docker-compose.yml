# =============================================================================
# DB-ChatBot - Docker Compose
# Services: db (PostgreSQL 16), redis (Redis 7), app (FastAPI)
# Usage:
#   docker-compose up --build          Start all services
#   docker-compose up -d --build       Start in background
#   docker-compose logs -f app         View app logs
#   docker-compose down                Stop all
#   docker-compose down -v             Stop + remove volumes
#   docker-compose exec app alembic upgrade head   Run migrations
#   docker-compose exec redis redis-cli            Open Redis CLI
# =============================================================================

services:

  db:
    image: postgres:16-alpine
    container_name: db_chatbot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatbot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatbot_password}
      POSTGRES_DB: ${POSTGRES_DB:-chatbot_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatbot_user} -d ${POSTGRES_DB:-chatbot_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - chatbot_network

  redis:
    image: redis:7-alpine
    container_name: db_chatbot_redis
    restart: unless-stopped
    command: >
      redis-server
        --appendonly yes
        --appendfsync everysec
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - chatbot_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: db_chatbot_app
    restart: unless-stopped
    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --reload
        --reload-dir /app/app
        --log-level debug
    environment:
      APP_NAME: ${APP_NAME:-DB ChatBot}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DEBUG: ${DEBUG:-True}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-chatbot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatbot_password}
      POSTGRES_DB: ${POSTGRES_DB:-chatbot_db}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chatbot_user}:${POSTGRES_PASSWORD:-chatbot_password}@db:5432/${POSTGRES_DB:-chatbot_db}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-chatbot_user}:${POSTGRES_PASSWORD:-chatbot_password}@db:5432/${POSTGRES_DB:-chatbot_db}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_ECHO: ${DB_ECHO:-True}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-this-32ch}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-1.5-flash}
      CACHE_ENABLED: ${CACHE_ENABLED:-True}
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-86400}
      CACHE_SIMILARITY_THRESHOLD: ${CACHE_SIMILARITY_THRESHOLD:-0.92}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - chatbot_network

networks:
  chatbot_network:
    driver: bridge
    name: chatbot_network

volumes:
  postgres_data:
    name: db_chatbot_postgres_data
  redis_data:
    name: db_chatbot_redis_data