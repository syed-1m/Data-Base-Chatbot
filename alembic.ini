# =============================================================================
# alembic.ini
# Alembic migration configuration file.
#
# NOTE: The database URL is NOT set here — it is loaded from settings
# in alembic/env.py so it always stays in sync with your .env file.
# =============================================================================

[alembic]
# Path to the alembic directory (relative to this file)
script_location = alembic

# Template for naming migration files
# %(rev)s      = short revision id
# %(slug)s     = first 40 chars of the "Revision ID" comment
# %(epoch)s    = epoch timestamp
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for timestamps in migration file names
timezone = UTC

# Maximum length of migration message slug
truncate_slug_length = 40

# Set to True to run migrations within a transaction
# (set to False if your DB doesn't support DDL transactions)
transaction_per_migration = false

# ---------------------------------------------------------------------------
# Logging configuration for Alembic CLI output
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
